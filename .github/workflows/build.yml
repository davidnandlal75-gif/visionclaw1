}    }  }  private func handleMessage(_ text: String) async {    guard let data = text.data(using: .utf8),          let json = try? JSONSerialization.jsonObject(with: data) as? [String: Any],          let type = json["type"] as? String else {      return    }    switch type {    case "session.created":      NSLog("[OpenAI] Session created")      sendSessionUpdate()    case "session.updated":      NSLog("[OpenAI] Session updated — ready")      connectionState = .ready      resolveConnect(success: true)    case "response.audio.delta":      if let delta = json["delta"] as? String,         let audioData = Data(base64Encoded: delta) {        if !isModelSpeaking {          isModelSpeaking = true          if let speechEnd = lastUserSpeechEnd, !responseLatencyLogged {            let latency = Date().timeIntervalSince(speechEnd)            NSLog("[Latency] %.0fms (user speech end -> first audio)", latency * 1000)            responseLatencyLogged = true          }        }        onAudioReceived?(audioData)      }    case "response.audio_transcript.delta":      if let delta = json["delta"] as? String, !delta.isEmpty {        onOutputTranscription?(delta)      }    case "conversation.item.input_audio_transcription.completed":      if let transcript = json["transcript"] as? String, !transcript.isEmpty {        NSLog("[OpenAI] You: %@", transcript)        onInputTranscription?(transcript)      }    case "input_audio_buffer.speech_started":      NSLog("[OpenAI] Speech started (VAD)")      if isModelSpeaking {        isModelSpeaking = false        onInterrupted?()      }    case "input_audio_buffer.speech_stopped":      lastUserSpeechEnd = Date()      responseLatencyLogged = false    case "response.function_call_arguments.delta":      if let callId = json["call_id"] as? String,         let delta = json["delta"] as? String {        if let existing = pendingFunctionCalls[callId] {          pendingFunctionCalls[callId] = (existing.name, existing.arguments + delta)        } else {          let name = json["name"] as? String ?? ""          pendingFunctionCalls[callId] = (name, delta)        }      }    case "response.function_call_arguments.done":      if let callId = json["call_id"] as? String {        let name = json["name"] as? String ?? pendingFunctionCalls[callId]?.name ?? ""        let arguments = json["arguments"] as? String ?? pendingFunctionCalls[callId]?.arguments ?? "{}"        pendingFunctionCalls.removeValue(forKey: callId)        NSLog("[OpenAI] Tool call: %@ (id: %@)", name, callId)        let call = OpenAIFunctionCall(callId: callId, name: name, arguments: arguments)        onToolCall?(call)      }    case "response.done":      isModelSpeaking = false      responseLatencyLogged = false      onTurnComplete?()    case "error":      if let error = json["error"] as? [String: Any],         let message = error["message"] as? String {        NSLog("[OpenAI] Error: %@", message)        connectionState = .error(message)      }    default:      break    }  }}// MARK: - WebSocket Delegateprivate class OpenAIWebSocketDelegate: NSObject, URLSessionWebSocketDelegate {  var onOpen: ((String?) -> Void)?  var onClose: ((URLSessionWebSocketTask.CloseCode, Data?) -> Void)?  var onError: ((Error?) -> Void)?  func urlSession(    _ session: URLSession,    webSocketTask: URLSessionWebSocketTask,    didOpenWithProtocol protocol: String?  ) {    onOpen?(`protocol`)  }  func urlSession(    _ session: URLSession,    webSocketTask: URLSessionWebSocketTask,    didCloseWith closeCode: URLSessionWebSocketTask.CloseCode,    reason: Data?  ) {    onClose?(closeCode, reason)  }  func urlSession(    _ session: URLSession,    task: URLSessionTask,    didCompleteWithError error: Error?  ) {    if let error {      onError?(error)    }  }}
