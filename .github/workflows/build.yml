name: Build Fixed VisionClaw for iOS
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Xcode Version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Configure Central Secrets
        run: |
          cd samples/CameraAccess/CameraAccess
          echo 'enum Secrets { static let geminiAPIKey = "${{ secrets.GEMINI_API_KEY }}"; static let openaiAPIKey = ""; static let openClawHost = ""; static let openClawPort = 18789; static let openClawHookToken = ""; static let openClawGatewayToken = ""; static let openClawRelayURL = "" }' > Secrets.swift

      - name: Compile Application Bundle
        run: |
          cd samples/CameraAccess
          xcodebuild -project CameraAccess.xcodeproj \
                     -scheme CameraAccess \
                     -configuration Release \
                     -sdk iphoneos \
                     SYMROOT=$PWD/build \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGN_IDENTITY="" \
                     PROVISIONING_PROFILE_SPECIFIER=""

      - name: Package App to IPA
        run: |
          mkdir -p samples/CameraAccess/build/Payload
          cp -R samples/CameraAccess/build/Release-iphoneos/CameraAccess.app samples/CameraAccess/build/Payload/
          cd samples/CameraAccess/build && zip -r VisionClaw.ipa Payload

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VisionClaw-iOS-App
          path: samples/CameraAccess/build/VisionClaw.ipa
