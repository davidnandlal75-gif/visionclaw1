Collapse file‎relay/setup-tunnel.sh‎Copy file name to clipboard+72Lines changed: 72 additions & 0 deletionsViewedComment on this fileMore optionsOriginal file line numberDiff line numberDiff line change@@ -0,0 +1,72 @@#!/usr/bin/env bashset -euo pipefail# ─── Cloudflare Tunnel Setup for OpenClaw ───# Run this once on the Mac that hosts OpenClaw.# It installs cloudflared, authenticates with Cloudflare,# creates a named tunnel, and configures it to forward to OpenClaw.TUNNEL_NAME="openclaw-tunnel"OPENCLAW_PORT="${OPENCLAW_PORT:-18789}"echo "==> Installing cloudflared via Homebrew…"if ! command -v cloudflared &>/dev/null; then  brew install cloudflaredelse  echo "    cloudflared already installed."fiecho ""echo "==> Authenticating with Cloudflare…"echo "    A browser window will open — log in and select your domain."cloudflared tunnel loginecho ""echo "==> Creating tunnel '${TUNNEL_NAME}'…"if cloudflared tunnel list | grep -q "${TUNNEL_NAME}"; then  echo "    Tunnel '${TUNNEL_NAME}' already exists — skipping create."else  cloudflared tunnel create "${TUNNEL_NAME}"fiTUNNEL_ID=$(cloudflared tunnel list --output json | python3 -c "import json, systunnels = json.load(sys.stdin)for t in tunnels:    if t['name'] == '${TUNNEL_NAME}':        print(t['id'])        break")CONFIG_DIR="$HOME/.cloudflared"CONFIG_FILE="${CONFIG_DIR}/config.yml"echo ""echo "==> Writing config to ${CONFIG_FILE}…"cat > "${CONFIG_FILE}" <<EOFtunnel: ${TUNNEL_ID}credentials-file: ${CONFIG_DIR}/${TUNNEL_ID}.jsoningress:  - service: http://localhost:${OPENCLAW_PORT}EOFecho ""echo "============================================"echo "  Tunnel created: ${TUNNEL_NAME}"echo "  Tunnel ID:      ${TUNNEL_ID}"echo ""echo "  NEXT STEPS:"echo "  1. Create a DNS route for the tunnel:"echo "     cloudflared tunnel route dns ${TUNNEL_NAME} openclaw.yourdomain.com"echo ""echo "  2. Start the tunnel:"echo "     ./relay/start-tunnel.sh"echo ""echo "  3. Set the public URL in Secrets.swift:"echo "     static let openClawRelayURL = \"https://openclaw.yourdomain.com\""echo ""echo "  4. (Optional) Install the launchd plist for auto-start:"echo "     cp relay/com.cloudflare.openclaw-tunnel.plist ~/Library/LaunchAgents/"echo "     launchctl load ~/Library/LaunchAgents/com.cloudflare.openclaw-tunnel.plist"echo "============================================"
Collapse file‎relay/start-tunnel.sh‎Copy file name to clipboard+18Lines changed: 18 additions & 0 deletionsViewedComment on this fileMore optionsOriginal file line numberDiff line numberDiff line change@@ -0,0 +1,18 @@#!/usr/bin/env bashset -euo pipefail# Start the OpenClaw Cloudflare Tunnel.# Replace YOUR_TUNNEL_TOKEN with the token from your Cloudflare dashboard# or from the output of the setup-tunnel.sh script.TUNNEL_TOKEN="${CLOUDFLARE_TUNNEL_TOKEN:-YOUR_TUNNEL_TOKEN}"if [ "$TUNNEL_TOKEN" = "YOUR_TUNNEL_TOKEN" ]; then  echo "Error: Set CLOUDFLARE_TUNNEL_TOKEN or edit this script with your tunnel token."  echo "Run ./relay/setup-tunnel.sh first, or get the token from:"  echo "  https://one.dash.cloudflare.com → Zero Trust → Networks → Tunnels"  exit 1fiecho "Starting OpenClaw tunnel…"exec cloudflared tunnel run --token "${TUNNEL_TOKEN}"
