on      self.delegate.onOpen = { [weak self] protocol_ in        guard let self else { return }        Task { @MainActor in          self.connectionState = .settingUp          self.startReceiving()        }      }      self.delegate.onClose = { [weak self] code, reason in        guard let self else { return }        let reasonStr = reason.flatMap { String(data: $0, encoding: .utf8) } ?? "no reason"        Task { @MainActor in          self.resolveConnect(success: false)          self.connectionState = .disconnected          self.isModelSpeaking = false          self.onDisconnected?("Connection closed (code \(code.rawValue): \(reasonStr))")        }      }      self.delegate.onError = { [weak self] error in        guard let self else { return }        let msg = error?.localizedDescription ?? "Unknown error"        Task { @MainActor in          self.resolveConnect(success: false)          self.connectionState = .error(msg)          self.isModelSpeaking = false          self.onDisconnected?(msg)        }      }      var request = URLRequest(url: url)      request.setValue("Bearer \(OpenAIConfig.apiKey)", forHTTPHeaderField: "Authorization")      request.setValue("realtime=v1", forHTTPHeaderField: "OpenAI-Beta")      self.webSocketTask = self.urlSession.webSocketTask(with: request)      self.webSocketTask?.resume()      Task {        try? await Task.sleep(nanoseconds: 15_000_000_000)        await MainActor.run {          self.resolveConnect(success: false)          if self.connectionState == .connecting || self.connectionState == .settingUp {            self.connectionState = .error("Connection timed out")          }        }      }    }    return result  }  func disconnect() {    receiveTask?.cancel()    receiveTask = nil    webSocketTask?.cancel(with: .normalClosure, reason: nil)    webSocketTask = nil    delegate.onOpen = nil    delegate.onClose = nil    delegate.onError = nil    onToolCall = nil    connectionState = .disconnected    isModelSpeaking = false    pendingFunctionCalls.removeAll()    resolveConnect(success: false)  }  func sendAudio(data: Data) {    guard connectionState == .ready else { return }    sendQueue.async { [weak self] in      let base64 = data.base64EncodedString()      let json: [String: Any] = [        "type": "input_audio_buffer.append",        "audio": base64      ]      self?.sendJSON(json)    }  }  func sendVideoFrame(image: UIImage) {    guard connectionState == .ready else { return }    sendQueue.async { [weak self] in      guard let jpegData = image.jpegData(compressionQuality: AppConfig.videoJPEGQuality) else { return }      let base64 = jpegData.base64EncodedString()      let json: [String: Any] = [        "type": "conversation.item.create",        "item": [          "type": "message",          "role": "user",          "content": [            [              "type": "input_image",              "image_url": "data:image/jpeg;base64,\(base64)"            ] as [String: Any]          ]        ] as [String: Any]      ]      self?.sendJSON(json)    }  }  func sendToolResponse(callId: String, output: String) {    sendQueue.async { [weak self] in      let createItem: [String: Any] = [        "type": "conversation.item.create",        "item": [          "type": "function_call_output",          "call_id": callId,          "output": output        ] as [String: Any]      ]      self?.sendJSON(createItem)      let createResponse: [String: Any] = [        "type": "response.create"      ]      self?.sendJSON(createResponse)    }  }  // MARK: - Private  private func resolveConnect(success: Bool) {    if let cont = connectContinuation {      connectContinuation = nil      cont.resume(returning: success)    }  }  private func sendSessionUpdate() {    let tools: [[String: Any]] = ToolDeclarations.allDeclarations().map { decl in      var tool: [String: Any] = [        "type": "function",        "name": decl["name"] as? String ?? ""      ]      if let desc = decl["description"] as? String {        tool["description"]